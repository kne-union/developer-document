<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/pwa/home-apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0080FF" />
  <meta name="description" content="Powered By KneUnion Fastify App" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script>
    // 本站外壳。已发布应用的匹配在 app-center-pwa.js，其他系统改这份配置后引入同一脚本即可。
    window.__APP_CENTER_PWA__ = {
      publicUrl: '%PUBLIC_URL%',
      apiUrl: '%PUBLIC_URL%/api/v1/app-manager/app/center/public-list',
      manifestPrefix: '%PUBLIC_URL%/api/v1/app-manager',
      staticPrefix: '%PUBLIC_URL%/api/v1/static/file-id',
      defaultIcon: '%PUBLIC_URL%/pwa/apps-apple-touch-icon.png',
      shellEntries: [
        { path: '/apps', manifest: '/manifest-apps.json', icon: '/pwa/apps-apple-touch-icon.png', title: '应用中心' },
        { path: '/', manifest: '/manifest.json', icon: '/pwa/home-apple-touch-icon.png', title: '开发者文档' }
      ]
    };
  </script>
  <script src="%PUBLIC_URL%/app-center-pwa.js"></script>
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Developer Document</title>
  <style>
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f6f7f9;
    }

    #app-boot img {
      width: 72px;
      height: 72px;
      border-radius: 22%;
      overflow: hidden;
    }

    #app-boot-name {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="app-boot">
    <img id="app-boot-logo" alt="" src="%PUBLIC_URL%/pwa/home-apple-touch-icon.png" />
    <div id="app-boot-name"></div>
  </div>
  <script>
    (function () {
      var base = String(window.runtimePublicUrl || '').replace(/\/+$/, '');
      var img = document.getElementById('app-boot-logo');
      if (base && img) {
        var src = img.getAttribute('src') || '';
        if (src.charAt(0) === '/' && src.indexOf(base + '/') !== 0) {
          img.src = base + src;
        }
      }
      var active = window.__PWA_ACTIVE__;
      if (active && active.icon && img) {
        img.src = active.icon;
      }
      var name = document.getElementById('app-boot-name');
      if (name) {
        name.textContent = (active && active.title) || document.title;
      }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
