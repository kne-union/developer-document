<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/pwa/home-apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0080FF" />
  <meta name="description" content="Powered By KneUnion Fastify App" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script>
    (function () {
      // 解析阶段按路径写入 manifest / 图标。Safari 添加到程序坞只认这时的 link，事后改 href 不会再生效。
      var publicUrl = '%PUBLIC_URL%';
      var entries = {
        home: { manifest: '/manifest.json', icon: '/pwa/home-apple-touch-icon.png', title: '开发者文档' },
        apps: { manifest: '/manifest-apps.json', icon: '/pwa/apps-apple-touch-icon.png', title: '应用中心' }
      };
      var entryFor = function () {
        return /^\/apps(\/|$)/.test(window.location.pathname) ? entries.apps : entries.home;
      };
      var setAttr = function (id, name, value) {
        var el = document.getElementById(id);
        if (el && el.getAttribute(name) !== value) {
          el.setAttribute(name, value);
        }
      };
      var sync = function () {
        var entry = entryFor();
        setAttr('pwa-manifest', 'href', publicUrl + entry.manifest);
        setAttr('pwa-apple-touch-icon', 'href', publicUrl + entry.icon);
        setAttr('pwa-apple-title', 'content', entry.title);
      };
      var entry = entryFor();
      if (!document.getElementById('pwa-manifest')) {
        document.write(
          '<link id="pwa-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="' +
            publicUrl +
            entry.icon +
            '">' +
            '<meta id="pwa-apple-title" name="apple-mobile-web-app-title" content="' +
            entry.title +
            '">' +
            '<link id="pwa-manifest" rel="manifest" href="' +
            publicUrl +
            entry.manifest +
            '">'
        );
      }
      ['pushState', 'replaceState'].forEach(function (method) {
        var original = window.history[method];
        window.history[method] = function () {
          var result = original.apply(this, arguments);
          sync();
          return result;
        };
      });
      window.addEventListener('popstate', sync);
    })();
  </script>
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Developer Document</title>
  <style>
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0080FF;
    }

    #app-boot img {
      width: 72px;
      height: 72px;
    }

    #app-boot-name {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="app-boot">
    <img id="app-boot-logo" alt="" src="%PUBLIC_URL%/pwa/home-apple-touch-icon.png" />
    <div id="app-boot-name"></div>
  </div>
  <script>
    (function () {
      var base = String(window.runtimePublicUrl || '').replace(/\/+$/, '');
      var img = document.getElementById('app-boot-logo');
      if (base && img) {
        var src = img.getAttribute('src') || '';
        if (src.charAt(0) === '/' && src.indexOf(base + '/') !== 0) {
          img.src = base + src;
        }
      }
      var name = document.getElementById('app-boot-name');
      if (name) {
        name.textContent = document.title;
      }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</body>

</html>
